<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
        </radialGradient>
    </defs>
    
    <!-- Background Canvas -->
    <rect width="800" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Decorative Subtle Grid Lines -->
    <path d="M0 60 H800 M0 120 H800 M0 180 H800" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.4"/>
    <path d="M200 0 V240 M400 0 V240 M600 0 V240" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.4"/>
    
    <!-- Brand Mark Monogram (A + P Interlocking) -->
    <g transform="translate(68, 48)">
        <!-- Ambient Glow using Radial Gradient (safe for GitHub sanitizer) -->
        <circle cx="72" cy="72" r="70" fill="url(#ambientGlow)" />
        <rect width="144" height="144" rx="28" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
        
        <!-- Geometric Vektor AP -->
        <g transform="translate(24, 24) scale(3)">
            <path d="M16 4L5 27H11L13.8 21H20.5C24.0899 21 27 18.0899 27 14.5C27 10.9101 24.0899 8 20.5 8H16L16 4Z" fill="url(#accentGrad)" />
            <path d="M16 11H20.5C22.433 11 24 12.567 24 14.5C24 16.433 22.433 18 20.5 18H15.2L16 11Z" fill="#F8FAFC" />
            <polygon points="16,11 12,21 15,21 17.5,15" fill="#1D4ED8" />
        </g>
    </g>
    
    <!-- Typography & Identity Lockup -->
    <g transform="translate(244, 95)">
        <text font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
