            <rect width="104" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
            <text x="12" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">WCAG AA 17:1</text>
            
            <rect x="114" width="94" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
            <text x="126" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">ZERO SLOP</text>

            <rect x="218" width="154" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
            <text x="230" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">LARAVEL 12 + REVERB</text>
